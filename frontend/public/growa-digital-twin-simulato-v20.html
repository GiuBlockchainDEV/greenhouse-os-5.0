function statusOf(n){const s=app.sim,m=s.measurements,t=s.tanks[n.id];
 if(n.kind==='tank')return `${fmt(S.level(t),0)}% · ${fmt(t?.volumeL||0,0)} L`;
 if(n.role==='source')return n.params.type==='well'?`${fmt(n.params.availableFlow,1)} m³/h · depth ${fmt(n.params.dynamicLevel,0)} m`:`${fmt(n.params.availableFlow,1)} m³/h available`;
 if(n.kind==='pump'){const key=n.role==='mixPump'?'mixQ':n.role==='cropPump'?'cropQ':n.role==='transferPump'?'transferQ':n.role==='boosterPump'?'inlineQ':null;return `${fmt(key?m[key]:0,2)} m³/h · ${key&&m[key]>.01?'RUN':'READY'}`;}
 if(n.kind==='injector')return `${n.params.channels||4} channels · ${s.commands.dose?'DOSING':'STANDBY'}`;
 if(n.kind==='sensor')return `EC ${fmt(m.actualEC,2)} · pH ${fmt(m.actualPH,2)}`;
 if(n.kind==='flowmeter')return `${fmt(n.role==='mixFlow'?m.mixQ:m.inlineQ,2)} m³/h`;
 if(n.kind==='filter')return `ΔP ${fmt(n.params.cleanDP*(1+5*n.params.fouling),2)} bar`;
 if(n.kind==='valve')return n.params.open?'OPEN':'CLOSED';
 if(n.kind==='manifold')return `${(n.params.enabled||[]).filter(Boolean).length}/${n.params.sectors} sectors open`;
 if(n.kind==='crop')return n.params.system==='nft'?`${fmt(n.params.uptakeLpd,0)} L/day uptake`:`${fmt(n.params.areaM2,0)} m² · drip`;
 return n.label;
}

function updateGameHUD(){if(app.mode!=='simulate')return;gameProgress();const intro=document.getElementById('game-intro');if(intro&&(app.sim.playing||app.sim.t>0))intro.remove();const set=(id,content)=>{const e=document.getElementById(id);if(e)e.innerHTML=content};set('game-mission-panel',gameMissionMarkup());set('game-quick-controls',gameQuickActions());set('game-metrics',gameHudMetrics());set('game-focus-panel',gameFocusCard());set('game-minimap',gameMiniMap());set('game-drawer',gameDrawerContent());
 const s=app.sim;const time=document.getElementById('game-dayclock');if(time)time.textContent=gameClock();const el=document.getElementById('game-elapsed');if(el)el.textContent='T+ '+clock(s.t);const run=document.getElementById('game-run-state');if(run)run.textContent=s.playing?'SIMULATION RUNNING':'SIMULATION PAUSED';const runtime=document.getElementById('game-runtime');if(runtime)runtime.textContent='T+'+clock(s.t);
 const light=document.querySelector('.game-status-light');if(light)light.classList.toggle('playing',s.playing);const play=document.querySelector('[data-action="game-play"]');if(play){play.innerHTML=ico(s.playing?'pause':'play')+(s.playing?' Pause':' Play');play.disabled=s.estop||!currentValidation().ready;}
 document.querySelectorAll('.game-speed button').forEach(b=>b.classList.toggle('active',Number(b.dataset.speed)===s.speed));const drawer=document.getElementById('game-drawer');if(drawer)drawer.classList.toggle('open',!!app.gameDrawer);const estop=document.querySelector('.game-emergency');if(estop){estop.classList.toggle('triggered',s.estop);estop.innerHTML=ico('alert')+` <span>${s.estop?'ACKNOWLEDGE':'E-STOP'}</span>`;}}
function handleGameAction(btn){const a=btn.dataset.action,s=app.sim,p=app.project,valid=currentValidation();
 if(a==='game-start') {if(!valid.ready||s.estop){toast('Correct the design or acknowledge the emergency stop first','error');return;}
  const startKey=E.isNFT(p)?'mix':'inline',first=S.command(p,s,startKey,true);if(!first.ok){toast(first.message,'error');return;}if(E.isNFT(p))S.command(p,s,'crop',true);s.playing=true;app.gameDrawer='';render();return;}
 if(a==='game-play'){if(s.estop||!valid.ready){toast('Correct the model or acknowledge E-stop before running','error');return;}s.playing=!s.playing;updateGameHUD();return;}
 if(a==='game-command'){const key=btn.dataset.command,ret=S.command(p,s,key,!s.commands[key]);if(!ret.ok){toast(ret.message,'error');return;}if(s.commands[key]&&valid.ready)s.playing=true;if(document.getElementById('game-intro'))render();else updateGameHUD();G.plant3d.refresh(p,s);return;}
 if(a==='game-speed'){s.speed=Number(btn.dataset.speed)||1;updateGameHUD();return;}
 if(a==='game-step'){if(s.estop||!valid.ready){toast('Simulation blocked by safety or design state','error');return;}S.step(p,s,600);G.plant3d.refresh(p,s);updateGameHUD();toast('Advanced 10 virtual minutes');return;}
 if(a==='game-reset'){app.sim=S.create(p);app.gameAchieved={};app.gameFocus=null;app.gameDrawer='';render();toast('Plant and scenario reset');return;}
 if(a==='game-select'){app.gameFocus=btn.dataset.id||null;updateGameHUD();G.plant3d.refresh(p,s);return;}
 if(a==='game-clear-focus'){app.gameFocus=null;updateGameHUD();G.plant3d.refresh(p,s);return;}
 if(a==='game-drawer'){app.gameDrawer=app.gameDrawer===btn.dataset.drawer?'':btn.dataset.drawer;updateGameHUD();return;}
 if(a==='game-fault'){const key=btn.dataset.fault;const next=!s.faults[key];Object.keys(s.faults).forEach(k=>{if(s.faults[k])S.fault(s,k,false)});if(next){S.fault(s,key,true);const stop=key==='pump'?['mix','crop','transfer','dose','inline','fill']:key==='return'?['crop']:key==='ec'?['dose']:key==='source'?['fill']:[];stop.forEach(k=>{if(s.commands[k])S.command(p,s,k,false)});}updateGameHUD();G.plant3d.refresh(p,s);toast(next?`Scenario triggered: ${key}`:'Fault cleared',next?'error':'');return;}
 if(a==='game-clear-faults'){Object.keys(s.faults).forEach(k=>{if(s.faults[k])S.fault(s,k,false)});updateGameHUD();toast('Injected faults cleared; restart equipment manually');return;}
 if(a==='game-estop'){if(s.estop){S.acknowledge(s);toast('E-stop acknowledged. All virtual commands remain OFF.');}else{S.emergency(s);toast('VIRTUAL E-STOP: all equipment inhibited','error');}updateGameHUD();G.plant3d.refresh(p,s);return;}
 if(a==='game-camera'){app.gameCamera=(app.gameCamera==='iso'?'front':'iso');G.plant3d.view(app.gameCamera);return;}
}

function p19ModelStatus(){
 const s=app.sim,p=app.project,nft=E.isNFT(p),m=s.measurements;
 const q=Number(nft?m.cropQ:m.inlineQ)||0;
 const tank=S.tankOf(p,s,nft?'cropTank':'mixTank')||S.tankOf(p,s,'mixTank');
 const pct=tank?S.level(tank):0;
 const consumption=nft?(Number(s.totals.uptakeL)||0)+(Number(s.totals.evapL)||0):(Number(s.totals.deliveredL)||0);
 return {nft,q,pct,consumption,pumpTag:nft?'P-303':'P-101',faultKey:nft?'return':'pump'};
}

const p19LegacyGameAction=handleGameAction;
handleGameAction=function(btn){
 const a=btn.dataset.action,s=app.sim,p=app.project,v=currentValidation();
 const nft=E.isNFT(p),key=nft?'crop':'inline';
 if(a==='game-show-sensors'){app.p20SensorsOpen=!app.p20SensorsOpen;app.showManual=app.p20SensorsOpen;updateGameHUD();return;}
 if(a==='game-export-sensors'){X.download((p.meta.reference||'GROWA')+'_virtual_sensors.csv',G.synthetic.csv(p,s),'text/csv;charset=utf-8');toast('CSV dati virtuali esportato');return;}
 if(a==='game-show-controls'){if(app.p20SensorsOpen){app.p20SensorsOpen=false;app.showManual=true;}else app.showManual=!app.showManual;updateGameHUD();return;}
 if(a==='game-lesson-free'){app.lessonPhase='free';app.showManual=true;updateGameHUD();return;}
 if(a==='game-reset'){app.sim=S.create(p);app.lessonPhase='start';app.gameFocus=null;app.showManual=false;app.gameAchieved={};render();return;}
 if(a==='game-lesson-start'){
  if(!v.ready||s.estop){toast('Prima correggi il progetto o rimuovi l\'arresto virtuale','error');return;}
  const commands=nft?['mix','crop']:['inline'];
  const started=[];
  for(const cmd of commands){const r=S.command(p,s,cmd,true);if(!r.ok){started.forEach(k=>S.command(p,s,k,false));toast('Avvio non consentito: '+r.message,'error');return;}started.push(cmd);}
  s.playing=true;S.step(p,s,8);app.lessonPhase='observe';render();return;
 }
 if(a==='game-lesson-advance'){
  if(!v.ready||s.estop){toast('Il modello \u00e8 bloccato','error');return;}
  S.step(p,s,600);app.lessonPhase='incident';G.plant3d.refresh(p,s);updateGameHUD();return;
 }
 if(a==='game-lesson-fault'){
  S.fault(s,nft?'return':'pump',true);
  if(s.commands[key])S.command(p,s,key,false);
  S.step(p,s,8);app.lessonPhase='fault';G.plant3d.refresh(p,s);updateGameHUD();return;
 }
 if(a==='game-lesson-clear'){
  S.fault(s,nft?'return':'pump',false);app.lessonPhase='restore';G.plant3d.refresh(p,s);updateGameHUD();return;
 }
 if(a==='game-lesson-resume'){
  const r=S.command(p,s,key,true);
  if(!r.ok){toast('Riavvio bloccato: '+r.message,'error');return;}
  s.playing=true;S.step(p,s,12);app.lessonPhase='done';G.plant3d.refresh(p,s);updateGameHUD();return;
 }
 if(a==='game-estop'){
  p19LegacyGameAction(btn);
  if(!app.sim.estop){app.lessonPhase='start';app.showManual=false;}else app.showManual=false;
  updateGameHUD();return;
 }
 if(a==='game-command'){
  p19LegacyGameAction(btn);app.showManual=false;updateGameHUD();return;
 }
 p19LegacyGameAction(btn);
};
const p19LegacyResetRuntime=resetRuntime;
resetRuntime=function(reason){p19LegacyResetRuntime(reason);app.lessonPhase='start';app.showManual=false;app.p20SensorsOpen=false;app.gameFocus=null;};
const p19LegacyChange=handleChange;
handleChange=function(ev){
 if(ev.target.id==='p19-preset'||ev.target.id==='p19-drawer-template'){
  const id=ev.target.value;if(id===app.project.template)return;
  if(JSON.stringify(app.project)!==app.p19TemplateSnapshot&&!confirm('Questo esempio sostituira le modifiche al progetto corrente. Continua?')){ev.target.value=app.project.template;return;}
  store.setTemplate(id);app.project=store.project;app.p19TemplateSnapshot=JSON.stringify(app.project);app.baseline=null;app.selected=null;app.inspectorOpen=false;app.gameFocus=null;app.lessonPhase='start';app.showManual=false;resetRuntime('Esempio impianto caricato');app.mode='simulate';render();return;
 }
 return p19LegacyChange(ev);
};

function edgePath(e){const a=getNode(e.from),b=getNode(e.to);if(!a||!b)return '';
 const W=176,H=84,sx=a.x+W,sy=a.y+H/2,tx=b.x,ty=b.y+H/2;
 if(tx>sx+8&&Math.abs(ty-sy)<17)return `M${sx} ${sy} H${tx}`;
 const out=sx+22,into=tx-22;
 if(ty===sy||e.route==='loop-below'){
  const below=Math.max(a.y,b.y)+H+38;
  return `M${sx} ${sy}H${out}V${below}H${into}V${ty}H${tx}`;
 }
 const between=(sy+ty)/2;
 // Corridor routed between equipment rows to preserve legibility.
 return `M${sx} ${sy}H${out}V${between}H${into}V${ty}H${tx}`;
}

utton" data-action="3d-zoom" data-factor="0.83" title="Zoom in">${ico('plus')}</button><button class="toolbutton primary-review-export" data-action="export-3d">${ico('download','small')}<span>PNG</span></button>`}</div></div>`;}
function reviewArea(){const pid=app.mode==='pid';return `<div class="center-pane review-center">${reviewToolbar()}<div class="review-scene ${pid?'pid-area':'model3d-area'}" id="${pid?'pid-area':'model3d-area'}">${pid?`<div class="pid-canvas" id="pid-container" aria-label="Interactive technical P and ID"></div>`:`<canvas id="plant3d-canvas" aria-label="Interactive 3D plant model. Drag to orbit, wheel to zoom"></canvas><div class="plant3d-labels" id="plant3d-labels"></div><div class="plant3d-error" id="plant3d-error" hidden></div><div id="plant3d-compatibility" class="plant3d-compatibility" hidden>SOFTWARE 3D · COMPATIBILITY MODE</div><div class="scene-overlay 3d-scene-caption"><div class="scene-eyebrow">3D EQUIPMENT & PIPE ARRANGEMENT</div><div class="scene-hint">Drag to orbit · scroll to zoom · Shift+drag to pan</div></div><div class="plant3d-legend"><span><i style="background:${paletteColors.source}"></i>Intake</span><span><i style="background:${paletteColors.mix}"></i>Mixing</span><span><i style="background:${paletteColors.crop}"></i>Crop</span><span><i style="background:${paletteColors.transfer}"></i>Transfer</span></div>`}<div class="scene-status">${ico('info','small')} PRELIMINARY MODEL · NO LIVE PLC CONNECTION</div></div>${renderDock()}</div>`;}
function renderMainArea(){if(app.mode==='pid'||app.mode==='model3d')return reviewArea();if(app.mode==='deliver')return `<div class="center-pane"><div class="mobile-document-actions"><button class="soft-btn" data-action="sheet" data-sheet="library">${ico('folder','small')} Project tools &amp; import</button></div>${renderReport()}</div>`;return `<div class="center-pane">${renderToolbar()}${renderGraphArea()}${renderDock()}</div>`;}
function render(){if(G.plant3d)G.plant3d.cleanup();const left=document.querySelector('#leftPane'),right=document.querySelector('#rightPane');const sl=left?.scrollTop||0,sr=right?.scrollTop||0;const root=document.getElementById('app');if(!root)return;
 if(app.mode==='simulate'){root.innerHTML=renderGameMode();G.plant3d.mount(root,app.project,app.sim,id=>{app.gameFocus=id;updateGameHUD();G.plant3d.refresh(app.project,app.sim);});return;}
 root.innerHTML=renderTop()+`<div class="shell">${renderRail()}<main class="stage">${renderStageHeader()}${renderKPIs()}<div class="workspace ${!app.inspectorOpen&&app.sheet!=='inspector'?'inspector-closed':''} ${app.sheet==='library'?'show-library':app.sheet==='inspector'?'show-inspector':''}">${renderLeft()}${renderMainArea()}${renderRight()}</div></main></div><div id="toast-placeholder"></div>`;
 const l=document.querySelector('#leftPane'),r=document.querySelector('#rightPane');if(l)l.scrollTop=sl;if(r)r.scrollTop=sr;
 if(app.mode==='pid')G.pid.mount(root,app.project,app.sim);else if(app.mode==='model3d')G.plant3d.mount(root,app.project,app.sim,id=>select('node',id));else if(app.mode!=='deliver'){drawGraph();}
}
function drawGraph(){const target=document.getElementById('svg-container');if(!target)return;target.innerHTML=graphSVG();}
function fit(){if(app.mode==='pid'){G.pid.reset();return;}if(app.mode==='model3d'){G.plant3d.view('iso');return;}const area=document.getElementById('graph-area');if(!area||!app.project.nodes.length)return;
 const w=area.clientWidth,h=area.clientHeight;const xs=app.project.nodes.map(n=>n.x),ys=app.project.nodes.map(n=>n.y);
 const x0=Math.min(...xs)-42,y0=Math.min(...ys)-35,x1=Math.max(...xs)+225,y1=Math.max(...ys)+127;
 const zoom=Math.min(1.15,(w-38)/(x1-x0),(h-18)/(y1-y0));app.view.scale=Math.max(.3,zoom);app.view.tx=(w-(x1-x0)*zoom)/2-x0*zoom;app.view.ty=(h-(y1-y0)*zoom)/2-y0*zoom;drawGraph();}
function focusLane(lane){const area=document.getElementById('graph-area');if(!area)return;const y=lane===0?75:lane===1?250:425;const z=window.innerWidth<=700?.98:.88;app.view.scale=z;app.view.tx=18-65*z;app.view.ty=area.clientHeight*.49-(y+40)*z;drawGraph();const display=document.querySelector('.scale-value');if(display)display.textContent=Math.round(z*100)+'%';document.querySelectorAll('.mobile-lanes button').forEach((b,i)=>b.classList.toggle('active',i===lane));}
function initialView(){if(window.innerWidth<=700&&app.project.nodes.length)focusLane(0);else fit();}
function zoom(factor,point){const area=document.getElementById('graph-area');if(!area)return;const rect=area.getBoundingClientRect();const px=point?.x??rect.width/2,py=point?.y??rect.height/2,prev=app.view.scale,next=Math.max(.22,Math.min(2.2,prev*factor));
 app.view.tx=px-(px-app.view.tx)*next/prev;app.view.ty=py-(py-app.view.ty)*next/prev;app.view.scale=next;drawGraph();const scale=document.querySelector('.scale-value');if(scale)scale.textContent=Math.round(next*100)+'%';}
function graphCoords(e){const rect=document.getElementById('graph-area')?.getBoundingClientRect();if(!rect)return {x:0,y:0};return {x:(e.clientX-rect.left-app.view.tx)/app.view.scale,y:(e.clientY-rect.top-app.view.ty)/app.view.scale}}
function select(type,id){app.selected={type,id};app.inspectorOpen=true;render();}
function resetRuntime(reason){app.sim.playing=false;app.sim=S.create(app.project);if(reason)S.log(app.sim,reason);}
function changeModel(fn,reason){if(app.sim.playing){toast('Pause the simulator before modifying plant geometry','error');return false;}const changed=store.mutate(fn);if(changed){app.project=store.project;resetRuntime(reason||'Design changed · simulation reset');render();}return changed;}
function toast(message,kind=''){let t=document.getElementById('gs-toast');if(t)t.remove();t=document.createElement('div');t.id='gs-toast';t.className=`toast ${kind}`;t.setAttribute('role','status');t.textContent=message;document.body.appendChild(t);clearTimeout(app.toastTimer);app.toastTimer=setTimeout(()=>t.remove(),3600);}
function selectMode(mode){if(G.plant3d)G.plant3d.cleanup();if(mode==='simulate'&&app.mode!=='simulate'){app.gameFocus=null;app.gameDrawer='';}if(mode==='pid')G.pid.mobileFocus();app.mode=mode;app.sheet='';app.dockExpanded=mode==='simulate'||mode==='validate';if(mode==='simulate'&&!currentValidation().ready)toast('Fix the blocking topology issues before running the model','error');render();}
function downloadSvg(){const text=G.pid.render(app.project,app.sim,false);X.download(`${app.project.meta.reference||'GROWA'}_schematic_PID_preliminary.svg`,text,'image/svg+xml');}
function exportAction(action){const p=app.project,s=app.sim,b=p.meta.reference||'GROWA';const actions={
 'export-project':()=>X.download(`${b}_design_v16.json`,X.project(p),'application/json'),
 'export-bom':()=>X.download(`${b}_equipment_schedule.csv`,X.bom(p),'text/csv;charset=utf-8'),
 'export-pipes':()=>X.download(`${b}_pipe_schedule.csv`,X.pipeSchedule(p),'text/csv;charset=utf-8'),
 'export-trends':()=>X.download(`${b}_simulation_trends.csv`,X.trends(s),'text/csv;charset=utf-8'),
 'export-report':()=>X.download(`${b}_engineering_review.html`,X.report(p,s),'text/html;charset=utf-8'),
 'export-svg':downloadSvg,'export-pid':downloadSvg};(actions[action]||(()=>{}))();toast('Export prepared locally');}
function addComponent(kind,pos){const area=document.getElementById('graph-area');if(app.sim.playing){toast('Pause the simulator to edit the plant','error');return;}const rect=area?.getBoundingClientRect(),xy=pos||{x:(rect?.width/2-app.view.tx)/app.view.scale,y:(rect?.height/2-app.view.ty)/app.view.scale};let id=store.add(kind,xy.x-88,xy.y-42);app.project=store.project;resetRuntime('New equipment added');app.selected={type:'node',id};app.inspectorOpen=true;render();toast(`${C.items[kind].name} added · assign its process role and connect ports`);}
function handleAction(btn){const action=btn.dataset.action,s=app.sim,p=app.project,what=selected();
 if(action.startsWith('game-')){handleGameAction(btn);return;}
 if(action==='nav'){selectMode(btn.dataset.mode||'design');return;}
 if(action==='inspect-node'){select('node',btn.dataset.id);if(window.innerWidth<=1050){app.sheet='inspector';render();}return;}
 if(action==='pid-zoom-in'){G.pid.zoom(.8);return;}
 if(action==='pid-zoom-out'){G.pid.zoom(1.25);return;}
 if(action==='pid-fit'){G.pid.reset();return;}
 if(action==='pid-labels'){G.pid.toggleTags();G.pid.mount(document,app.project,app.sim);return;}
 if(action==='pid-flow'){G.pid.toggleValues();G.pid.mount(document,app.project,app.sim);return;}
 if(action==='3d-view'){G.plant3d.view(btn.dataset.view||'iso');return;}
 if(action==='3d-zoom'){G.plant3d.zoom(Number(btn.dataset.factor)||1);return;}
 if(action==='export-3d'){if(!G.plant3d.exportPNG(p.meta.reference))toast('3D viewport is unavailable','error');return;}
 if(action==='sheet'){app.sheet=app.sheet===btn.dataset.sheet?'':btn.dataset.sheet;if(app.sheet==='inspector')app.inspectorOpen=true;render();return;}
 if(action==='open-project'){app.selected={type:'project'};app.inspectorOpen=true;app.sheet='inspector';render();return;}
 if(action==='toggle-inspector'){app.inspectorOpen=!app.inspectorOpen;render();requestAnimationFrame(fit);return;}
 if(action==='toggle-dock'){app.dockExpanded=!app.dockExpanded;render();requestAnimationFrame(fit);return;}
 if(action==='focus-lane'){focusLane(Number(btn.dataset.lane||0));return;}
 if(action==='fit'){fit();return;}if(action==='zoom-in'){zoom(1.2);return;}if(action==='zoom-out'){zoom(1/1.2);return;}
 if(action==='cancel-link'){app.connect=null;drawGraph();return;}
 if(action==='undo'||action==='redo'){if(s.playing){toast('Pause the model to undo design changes','error');return;}if(store[action]()){app.project=store.project;resetRuntime(`${action} applied to plant model`);app.selected=null;render();fit();}return;}
 if(action==='new-blank'){if(!confirm('Start a new empty design? The current design is saved locally and can be exported first.'))return;store.blank();app.project=store.project;app.baseline=null;resetRuntime();app.selected={type:'project'};app.inspectorOpen=true;app.mode='design';render();toast('Blank project created; assign roles and connect components');return;}
 if(action==='import'){document.getElementById('import-project')?.click();return;}
 if(action.startsWith('export-')){exportAction(action);return;}
 if(action==='dock'){app.dock=btn.dataset.dock;app.dockExpanded=true;render();requestAnimationFrame(fit);return;}
 if(action==='play'){if(!currentValidation().ready||s.estop){toast('Simulation blocked by design or safety state','error');return;}s.playing=true;s.lastRunAt=performance.now();render();return;}
 if(action==='pause'){s.playing=false;render();return;}
 if(action==='step-ten'){if(s.estop||!currentValidation().ready){toast('Simulation blocked','error');return;}S.step(p,s,600);render();toast('Advanced virtual plant by 10 minutes');return;}
 if(action==='capture-baseline'){if(s.t<10){toast('Run the model before capturing a baseline','error');return;}app.baseline={name:p.meta.reference,history:C.clone(s.history),totals:C.clone(s.totals),capturedAt:s.t,template:p.template};render();toast('Reference run saved for comparison');return;}
 if(action==='clear-baseline'){app.baseline=null;render();toast('Comparison baseline cleared');return;}
 if(action==='reset-sim'){app.gameAchieved={};app.sim=S.create(p);render();toast('Simulation reset to the project design baseline');return;}
 if(action==='speed'){s.speed=Number(btn.dataset.speed);render();return;}
 if(action==='cmd'){const key=btn.dataset.command,ret=S.command(p,s,key,!s.commands[key]);if(!ret.ok)toast(ret.message,'error');else toast(`${key.toUpperCase()} ${s.commands[key]?'enabled':'stopped'}`);render();return;}
 if(action==='estop'){if(s.estop){S.acknowledge(s);toast('E-stop acknowledged. All commands remain OFF.');}else{S.emergency(s);toast('Virtual E-stop latched; all pump commands inhibited','error');}render();return;}
 if(action==='zone'){if(app.selected?.type!=='node')return;const n=getNode(app.selected.id),index=Number(btn.dataset.zone);changeModel(p=>{const a=p.nodes.find(a=>a.id===n.id);if(a?.params.enabled)a.params.enabled[index]=!a.params.enabled[index]},'Sector configuration changed');return;}
 if(action==='focus-issue'){const issue=currentValidation().issues[Number(btn.dataset.issue)];if(issue?.nodeId){app.selected={type:'node',id:issue.nodeId};app.inspectorOpen=true;app.mode='design';render();app.sheet='inspector';render();toast(issue.detail);}else toast(issue?.detail||'No component to focus');return;}
 if(action==='delete-selected'){if(!app.selected||app.selected.type==='project')return;if(s.playing){toast('Pause simulation before removing equipment','error');return;}const label=app.selected.type==='node'?getNode(app.selected.id)?.tag:app.selected.id;if(!confirm(`Remove ${label} and its connected piping from the plant model?`))return;
   if(app.selected.type==='node')store.removeNode(app.selected.id);else store.removeEdge(app.selected.id);app.project=store.project;app.selected=null;app.inspectorOpen=false;resetRuntime('Plant topology changed');render();toast(`${label} removed`);return;}
 if(action==='duplicate-node'){if(app.selected?.type!=='node')return;const n=getNode(app.selected.id),newId=store.add(n.kind,n.x+26,n.y+112);store.mutate(p=>{const t=p.nodes.find(a=>a.id===newId);t.label=n.label+' (copy)';t.role='custom';t.params=C.clone(n.params)});app.project=store.project;app.selected={type:'node',id:newId};app.inspectorOpen=true;resetRuntime('Asset duplicated');render();toast('Component duplicated as a supplementary asset');return;}
}
function handleClick(ev){const action=ev.target.closest('[data-action]');if(action){ev.preventDefault();handleAction(action);return;}
 const asset=ev.target.closest('[data-add-kind]');if(asset){ev.preventDefault();addComponent(asset.dataset.addKind);return;}
 const pidAsset=ev.target.closest('[data-pid-node]');if(pidAsset){ev.preventDefault();select('node',pidAsset.dataset.pidNode);if(window.innerWidth<=1050){app.sheet='inspector';render();}return;}
 const pidPipe=ev.target.closest('[data-pid-edge]');if(pidPipe){ev.preventDefault();select('edge',pidPipe.dataset.pidEdge);if(window.innerWidth<=1050){app.sheet='inspector';render();}return;}
 const plantAsset=ev.target.closest('[data-3d-node]');if(plantAsset){ev.preventDefault();if(app.mode==='simulate'){app.gameFocus=plantAsset.dataset['3dNode'];updateGameHUD();G.plant3d.refresh(app.project,app.sim);return;}select('node',plantAsset.dataset['3dNode']);if(window.innerWidth<=1050){app.sheet='inspector';render();}return;}
 const port=ev.target.closest('[data-port]');if(port){ev.preventDefault();ev.stopPropagation();const id=port.dataset.portId,type=port.dataset.port;
  if(type==='out'){app.connect={from:id};drawGraph();toast(`From ${getNode(id)?.tag}: select destination input port`);return;}
  if(type==='in'&&app.connect){const from=app.connect.from;app.connect=null;try{const edgeId=store.connect(from,id);app.project=store.project;app.selected={type:'edge',id:edgeId};app.inspectorOpen=true;resetRuntime('New hydraulic pipe connected');render();toast('Connection created · set inside diameter and length in inspector');}catch(err){toast(err.message,'error');drawGraph();}return;}
  toast('Start with an output port on the source component');return;
 }
 const node=ev.target.closest('[data-node-id]');if(node){if(app.drag?.moved)return;app.selected={type:'node',id:node.dataset.nodeId};app.inspectorOpen=true;app.sheet=window.innerWidth<=1050?'inspector':'';render();if(window.innerWidth>1050)requestAnimationFrame(fit);return;}
 const edge=ev.target.closest('[data-edge-id]');if(edge){app.selected={type:'edge',id:edge.dataset.edgeId};app.inspectorOpen=true;app.sheet=window.innerWidth<=1050?'inspector':'';render();if(window.innerWidth>1050)requestAnimationFrame(fit);return;}
 if(ev.target.closest('#graph-area')&&!app.justPanned){app.selected=null;app.inspectorOpen=false;render();}
}
function handleChange(ev){const el=ev.target;if(el.id==='template-select'){
  const id=el.value;if(id===app.project.template)return;
  if(!confirm(`Open the ${C.templates[id].name} template? Current project remains saved locally. Export it first if you need a separate copy.`)){el.value=app.project.template;return;}
  store.setTemplate(id);app.project=store.project;app.baseline=null;resetRuntime('Selected a new plant template');app.mode='design';app.selected=null;app.inspectorOpen=false;app.dockExpanded=false;render();initialView();toast(`${C.templates[id].name} loaded`);return;}
 if(el.id==='scenario-select'){Object.keys(app.sim.faults).forEach(k=>app.sim.faults[k]=false);if(el.value!=='normal')S.fault(app.sim,el.value,true);else S.log(app.sim,'Faults cleared');render();return;}
 if(el.matches('[data-node-text]')){const key=el.dataset.nodeText,n=getNode(app.selected?.id);if(!n)return;changeModel(p=>{const obj=p.nodes.find(x=>x.id===n.id);if(obj){obj[key]=el.value.trim().slice(0,key==='tag'?64:100)||obj[key];}},`${n.tag} identification updated`);return;}
 if(el.matches('[data-node-role]')){const n=getNode(app.selected?.id);if(!n)return;changeModel(p=>{p.nodes.find(x=>x.id===n.id).role=el.value},`${n.tag} process role updated`);return;}
 if(el.matches('[data-node-select]')){const n=getNode(app.selected?.id);if(!n)return;changeModel(p=>{p.nodes.find(x=>x.id===n.id).params[el.dataset.nodeSelect]=el.value},`${n.tag} process type updated`);return;}
 if(el.matches('[data-node-bool]')){const n=getNode(app.selected?.id);if(!n)return;changeModel(p=>{p.nodes.find(x=>x.id===n.id).params[el.dataset.nodeBool]=el.checked},`${n.tag} state updated`);return;}
 if(el.matches('[data-setting-bool]')){changeModel(p=>{p.settings[el.dataset.settingBool]=el.checked},'Automatic function updated');return;}
 if(el.matches('[data-edge-enabled]')){const id=app.selected?.id;if(!id)return;changeModel(p=>{const e=p.edges.find(x=>x.id===id);if(e)e.enabled=el.checked},'Pipe activation changed');return;}
 if(el.matches('[data-edge-circuit]')){const id=app.selected?.id;if(!id)return;changeModel(p=>{const e=p.edges.find(x=>x.id===id);if(e)e.circuit=el.value},'Pipe circuit classification changed');return;}
 const group=['param','edge','setting','meta'].find(k=>el.hasAttribute('data-'+k));if(!group)return;const key=el.dataset[group],value=group==='meta'?el.value.trim().slice(0,140):Number(el.value),range=group==='param'?paramInfo[key]:group==='setting'?settingsInfo[key]:null;
 if(group!=='meta'&&(!Number.isFinite(value)||(range&&(value<range[2]||value>range[3]))||((group==='edge'&&key==='diameterMm')&&value<=0))){toast('Out-of-range engineering parameter','error');render();return;}
 changeModel(p=>{if(group==='meta')p.meta[key]=value;else if(group==='setting')p.settings[key]=value;else if(group==='param'){const n=p.nodes.find(n=>n.id===app.selected.id);if(n)n.params[key]=value;}else if(group==='edge'){const e=p.edges.find(e=>e.id===app.selected.id);if(e)e[key]=value;}},'Engineering parameters changed');
}
function handleInput(ev){if(ev.target.id==='asset-search'){app.search=ev.target.value;const search=app.search.trim().toLowerCase();document.querySelectorAll('.library-group').forEach(group=>{let count=0;group.querySelectorAll('.library-asset').forEach(el=>{const show=!search||el.textContent.toLowerCase().includes(search);el.style.display=show?'':'none';if(show)count++;});group.style.display=count?'':'none'})}}
function handlePointerDown(ev){if(ev.button!==0&&ev.pointerType==='mouse')return;const pid=ev.target.closest('#pid-area');if(pid&&!ev.target.closest('[data-pid-node],[data-pid-edge]')){app.pidDrag={x:ev.clientX,y:ev.clientY};return;}const area=ev.target.closest('#graph-area');if(!area)return;const nodeEl=ev.target.closest('[data-node-id]'),port=ev.target.closest('[data-port]');if(port)return;
 if(nodeEl){const id=nodeEl.dataset.nodeId,n=getNode(id);if(!n)return;if(app.sim.playing)return;
  app.drag={type:'node',id,startX:ev.clientX,startY:ev.clientY,nodeX:n.x,nodeY:n.y,moved:false};app.selected={type:'node',id};
 }else if(ev.target.closest('#graph-svg')){app.drag={type:'pan',startX:ev.clientX,startY:ev.clientY,tx:app.view.tx,ty:app.view.ty,moved:false};app.justPanned=false;}
}
function handlePointerMove(ev){if(app.pidDrag){G.pid.pan(ev.clientX-app.pidDrag.x,ev.clientY-app.pidDrag.y);app.pidDrag.x=ev.clientX;app.pidDrag.y=ev.clientY;return;}if(!app.drag)return;const d=app.drag,dx=ev.clientX-d.startX,dy=ev.clientY-d.startY;if(Math.abs(dx)+Math.abs(dy)>4)d.moved=true;if(!d.moved)return;
 if(d.type==='node'){const el=document.querySelector(`[data-node-id="${d.id}"]`);if(el)el.setAttribute('transform',`translate(${d.nodeX+dx/app.view.scale} ${d.nodeY+dy/app.view.scale})`);}
 else {app.view.tx=d.tx+dx;app.view.ty=d.ty+dy;const vp=document.getElementById('graph-viewport');if(vp)vp.setAttribute('transform',`translate(${app.view.tx} ${app.view.ty}) scale(${app.view.scale})`);}
}
function handlePointerUp(ev){if(app.pidDrag){app.pidDrag=null;return;}if(!app.drag)return;const d=app.drag;app.drag=null;
 if(d.type==='node'&&d.moved){const dx=(ev.clientX-d.startX)/app.view.scale,dy=(ev.clientY-d.startY)/app.view.scale;
  changeModel(p=>{const n=p.nodes.find(n=>n.id===d.id);if(n){n.x=Math.round(d.nodeX+dx);n.y=Math.round(d.nodeY+dy)}},'Equipment repositioned in plant layout');
 }else if(d.type==='pan'&&d.moved){app.justPanned=true;setTimeout(()=>app.justPanned=false,80);}
}
function handleWheel(ev){if(ev.target.closest('#pid-area')){ev.preventDefault();G.pid.zoom(ev.deltaY<0?.90:1.11,ev.clientX,ev.clientY);return;}if(!ev.target.closest('#graph-area'))return;ev.preventDefault();const rect=document.getElementById('graph-area').getBoundingClientRect();zoom(ev.deltaY<0?1.08:1/1.08,{x:ev.clientX-rect.left,y:ev.clientY-rect.top});}
function handleKey(ev){const focus=['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName);if(ev.key==='Escape'){if(app.connect){app.connect=null;drawGraph();return;}if(app.sheet){app.sheet='';render();return;}}if(focus)return;
 if(app.mode==='simulate'){if(ev.code==='Space'){ev.preventDefault();handleGameAction({dataset:{action:'game-play'}});}if(ev.key==='Escape'&&app.gameDrawer){app.gameDrawer='';updateGameHUD();}return;}
 if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='z'){ev.preventDefault();handleAction({dataset:{action:ev.shiftKey?'redo':'undo'}});return;}
 if((ev.key==='Delete'||ev.key==='Backspace')&&app.selected&&app.selected.type!=='project'){ev.preventDefault();handleAction({dataset:{action:'delete-selected'}});return;}
 if(ev.key==='Enter'&&document.activeElement?.matches('[data-add-kind]'))addComponent(document.activeElement.dataset.addKind);
}
function runLoop(){const now=performance.now();const elapsed=Math.min(.5,Math.max(0,(now-app.lastTime)/1000));app.lastTime=now;
 if(!app.sim.playing)return;
 const ok=currentValidation().ready;if(!ok||app.sim.estop){app.sim.playing=false;render();return;}
 S.step(app.project,app.sim,elapsed*app.sim.speed);
 if(!app._lastUiRender||now-app._lastUiRender>800){app._lastUiRender=now;
  if(!['INPUT','SELECT'].includes(document.activeElement?.tagName)){if(app.mode==='simulate'){G.plant3d.refresh(app.project,app.sim);updateGameHUD();}else if(app.mode==='model3d'||app.mode==='pid'){const strip=document.querySelector('.kpi-strip');if(strip)strip.outerHTML=renderKPIs();if(app.mode==='model3d')G.plant3d.refresh(app.project,app.sim);else G.pid.mount(document,app.project,app.sim);const dock=document.getElementById('data-dock');if(dock)dock.outerHTML=renderDock();}else render();}
 }
}
document.addEventListener('click',handleClick);
document.addEventListener('change',handleChange);
document.addEventListener('input',handleInput);
document.addEventListener('pointerdown',handlePointerDown);
document.addEventListener('pointermove',handlePointerMove);
document.addEventListener('pointerup',handlePointerUp);
document.addEventListener('wheel',handleWheel,{passive:false});
document.addEventListener('keydown',handleKey);
document.addEventListener('dragstart',ev=>{const item=ev.target.closest('[data-add-kind]');if(item){ev.dataTransfer.setData('text/growa-component',item.dataset.addKind);ev.dataTransfer.effectAllowed='copy';}});
document.addEventListener('dragover',ev=>{if(ev.target.closest('#graph-area')){ev.preventDefault();document.getElementById('graph-area')?.classList.add('drag-over')}});
document.addEventListener('dragleave',ev=>{if(ev.target.closest('#graph-area'))document.getElementById('graph-area')?.classList.remove('drag-over')});
document.addEventListener('drop',ev=>{const area=ev.target.closest('#graph-area');if(!area)return;ev.preventDefault();area.classList.remove('drag-over');const kind=ev.dataTransfer.getData('text/growa-component');if(C.items[kind])addComponent(kind,graphCoords(ev));});
document.getElementById('import-project')?.addEventListener('change',async ev=>{const file=ev.target.files?.[0];if(!file)return;try{store.import(await file.text());app.project=store.project;app.baseline=null;resetRuntime('Imported project file');app.selected=null;app.inspectorOpen=false;app.dockExpanded=false;app.mode='design';render();initialView();toast(`Imported ${app.project.meta.name}`);}catch(err){toast(`Import rejected: ${err.message}`,'error')}ev.target.value='';});
window.addEventListener('resize',()=>{if(!['deliver','pid','model3d'].includes(app.mode)){initialView()}});
render();requestAnimationFrame(()=>initialView());setInterval(runLoop,160);
})();


</script>
</body>
